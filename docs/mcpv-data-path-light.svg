<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 790" width="1240" height="790" role="img" aria-labelledby="t d">
<title id="t">How mcpv moves a secret</title>
<desc id="d">A .env file holds only mcpm:// addresses. mcpv run reads them, decrypts the matching values from the AES-256-GCM vault in memory, using a master key held in the OS keychain, and injects them into one child process. Vault and child process sit inside a dashed trust boundary. The child's stdout and stderr pass through a mask, so the agent only ever sees [redacted] in place of a value.</desc>
<style>
  text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .h { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #121216; }
  .hl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #121216; }
  .p { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #3d3d47; }
  .lbl { font-size: 10.5px; font-weight: 500; letter-spacing: .08em; fill: #6b6b78; }
  .c { font-size: 12.5px; fill: #3d3d47; }
  .ink { fill: #4a37d9; } .ok { fill: #067647; } .red { fill: #b42318; font-weight: 600; }
  .box { fill: #ffffff; stroke: #d6d6de; stroke-width: 1.2; }
  .vault { fill: #efecff; stroke: #5a46f0; stroke-width: 1.6; }
  .rule { stroke: #e7e7ec; stroke-width: 1; }
  .thin { fill: none; stroke: #d6d6de; stroke-width: 1; }
  .dim { stroke: #6b6b78; stroke-width: 1; }
  .flow { fill: none; stroke: #5a46f0; stroke-width: 1.6; stroke-dasharray: 6 5; animation: march 1.4s linear infinite; }
  .bound { fill: rgba(90,70,240,0.04); stroke: #5a46f0; stroke-opacity: .6; stroke-width: 1.2; stroke-dasharray: 8 6; }
  .acc { fill: none; stroke: #4a37d9; stroke-width: 1.8; stroke-linecap: round; }
  .mask { fill: rgba(180,35,24,0.09); stroke: #b42318; stroke-width: 1.6; stroke-linejoin: round; }
  .redbg { fill: rgba(180,35,24,0.09); stroke: #b42318; stroke-width: 1; }
  .co line { stroke: #d6d6de; stroke-width: 1; }
  .co circle { fill: #ffffff; stroke: #5a46f0; stroke-width: 1.4; }
  .co text { fill: #4a37d9; font-size: 12px; font-weight: 600; }
  @keyframes march { to { stroke-dashoffset: -22; } }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .anim { display: none; } }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1 10 5 0 9z" fill="#5a46f0"/></marker>
  <marker id="tk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M2 9 8 1" stroke="#6b6b78" stroke-width="1.4"/></marker>
  <path id="route" d="M246 260H346V215H446H546V260H646V288H662H824H850V260H896H996V234H1004"/>
</defs>

<!-- card -->
<rect x="0.5" y="0.5" width="1239" height="789" rx="18" fill="#ffffff" stroke="#e7e7ec"/>
<path d="M0.5 48V18.5a18 18 0 0 1 18-18h1203a18 18 0 0 1 18 18V48z" fill="#f8f8fa"/>
<line x1="0.5" y1="48" x2="1239.5" y2="48" class="rule"/>
<text x="24" y="29" class="lbl" style="font-size:12px">FIG. 1 · SYSTEM SCHEMATIC</text>
<text x="1216" y="29" text-anchor="end" class="lbl" style="font-size:12px">DATA PATH OF ONE SECRET</text>

<g transform="translate(20 64)">
  <!-- trust boundary -->
  <line class="thin" x1="300" y1="30" x2="300" y2="66"/><line class="thin" x1="880" y1="30" x2="880" y2="66"/>
  <line class="dim" x1="300" y1="42" x2="880" y2="42" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <rect x="398" y="31" width="384" height="22" rx="11" fill="#efecff"/>
  <text x="590" y="46" text-anchor="middle" class="lbl ink">TRUST BOUNDARY · PLAINTEXT ONLY IN MEMORY</text>
  <rect class="bound" x="300" y="70" width="580" height="392" rx="16"/>
  <text x="866" y="450" text-anchor="end" class="lbl ink">ZONE A · mcpv run</text>

  <!-- 1 .env -->
  <path class="box" d="M34 160h188l24 24v166a10 10 0 0 1-10 10H34a10 10 0 0 1-10-10V170a10 10 0 0 1 10-10z"/>
  <path class="thin" d="M222 160v24h24"/>
  <text x="40" y="186" class="lbl">FILE</text>
  <text x="40" y="210" class="h">.env</text>
  <line class="rule" x1="40" y1="224" x2="230" y2="224"/>
  <text x="40" y="248" class="c">STRIPE_KEY=</text>
  <text x="40" y="266" class="c ink">mcpm://acme/api/dev/</text>
  <text x="40" y="284" class="c ink">STRIPE_KEY</text>
  <text x="40" y="308" class="c">PORT=3000</text>
  <text x="40" y="340" class="lbl ok">SAFE TO COMMIT</text>
  <g class="co"><line x1="135" y1="112" x2="135" y2="160"/><circle cx="135" cy="98" r="14"/><text x="135" y="102.5" text-anchor="middle">1</text></g>

  <!-- connectors -->
  <path class="flow" d="M246 260H326" marker-end="url(#ar)"/>
  <path class="flow" d="M562 260H636" marker-end="url(#ar)"/>
  <path class="flow" d="M954 260H1000" marker-end="url(#ar)"/>
  <text x="270" y="248" text-anchor="middle" class="lbl">ADDR</text>

  <!-- 2 vault -->
  <rect class="vault" x="330" y="140" width="232" height="240" rx="16"/>
  <rect class="box" x="340" y="150" width="212" height="220" rx="10"/>
  <path class="acc" d="M430 196v-14a16 16 0 0 1 32 0v14"/>
  <rect class="acc" x="420" y="196" width="52" height="38" rx="6"/>
  <circle cx="446" cy="212" r="4" fill="#4a37d9"/><line x1="446" y1="214" x2="446" y2="224" class="acc"/>
  <text x="446" y="266" text-anchor="middle" class="h">mcpv vault</text>
  <text x="446" y="288" text-anchor="middle" class="c">AES-256-GCM</text>
  <text x="446" y="306" text-anchor="middle" class="c ink">fresh IV per value</text>
  <text x="446" y="324" text-anchor="middle" class="c ink">AAD = mcpm:// address</text>
  <text x="446" y="352" text-anchor="middle" class="lbl">~/.mcpv · 0700</text>
  <line x1="446" y1="380" x2="446" y2="404" class="thin" stroke-dasharray="3 3"/>
  <rect class="box" x="352" y="404" width="188" height="42" rx="8"/>
  <circle cx="372" cy="425" r="6" class="acc"/><path d="M378 425h14M388 425v6" class="acc"/>
  <text x="400" y="421" class="lbl">MASTER KEY</text>
  <text x="400" y="437" class="c" style="font-size:10.5px">Keychain · Secret Svc</text>
  <g class="co"><line x1="446" y1="112" x2="446" y2="140"/><circle cx="446" cy="98" r="14"/><text x="446" y="102.5" text-anchor="middle">2</text></g>

  <text x="600" y="246" text-anchor="middle" class="lbl">DECRYPT</text>
  <text x="600" y="282" text-anchor="middle" class="lbl">INJECT</text>

  <!-- 3 child process -->
  <rect class="box" x="640" y="160" width="222" height="200" rx="10"/>
  <line class="rule" x1="640" y1="192" x2="862" y2="192"/>
  <text x="654" y="182" class="lbl">CHILD PROCESS · PID 4182</text>
  <text x="654" y="218" class="c ink">$ npm run dev</text>
  <text x="654" y="250" class="lbl">ENV (IN MEMORY)</text>
  <text x="654" y="272" class="c">STRIPE_KEY=</text>
  <rect x="654" y="280" width="170" height="16" rx="3" fill="#121216"/>
  <!-- cover that shrinks as the dot fills the value bar (hidden under reduced motion) -->
  <rect class="anim" x="653" y="279" width="172" height="18" fill="#ffffff">
    <animate attributeName="x" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.459;0.599;1" values="653;653;825;825"/>
    <animate attributeName="width" dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.459;0.599;1" values="172;172;0;0"/>
  </rect>
  <text x="654" y="320" class="c">no MCPV_KEY</text>
  <text x="654" y="342" class="lbl">REAL VALUES · THIS PID</text>
  <g class="co"><line x1="751" y1="112" x2="751" y2="160"/><circle cx="751" cy="98" r="14"/><text x="751" y="102.5" text-anchor="middle">3</text></g>

  <!-- 4 mask -->
  <path class="thin" d="M862 260H882"/>
  <path class="mask" d="M882 222h72l-14 38 14 38h-72l14-38z"/>
  <text x="918" y="264" text-anchor="middle" class="c red">MASK</text>
  <text x="918" y="320" text-anchor="middle" class="lbl">STDOUT</text>
  <text x="918" y="336" text-anchor="middle" class="lbl">STDERR</text>
  <g class="co"><line x1="918" y1="186" x2="918" y2="222"/><circle cx="918" cy="172" r="14"/><text x="918" y="176.5" text-anchor="middle">4</text></g>

  <!-- 5 agent -->
  <rect class="box" x="1004" y="160" width="180" height="200" rx="10"/>
  <line class="rule" x1="1004" y1="192" x2="1184" y2="192"/>
  <text x="1016" y="182" class="lbl">AGENT · TRANSCRIPT</text>
  <text x="1016" y="220" class="c">stripe key=</text>
  <rect class="redbg" x="1011" y="226" width="82" height="17" rx="4">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.8;0.83;0.86;0.89;0.92;1" values="1;1;0.25;1;0.25;1;1"/>
  </rect>
  <text x="1016" y="238" class="c red">[redacted]</text>
  <text x="1016" y="262" class="c">db app:<tspan class="red">[redacted]</tspan></text>
  <text x="1016" y="286" class="c">✓ listening :3000</text>
  <text x="1016" y="320" class="lbl">SEES NAMES + OUTPUT</text>
  <text x="1016" y="342" class="lbl red">NEVER A VALUE</text>
  <g class="co"><line x1="1094" y1="112" x2="1094" y2="160"/><circle cx="1094" cy="98" r="14"/><text x="1094" y="102.5" text-anchor="middle">5</text></g>

  <!-- bottom dimensions -->
  <line class="thin" x1="24" y1="372" x2="24" y2="500"/><line class="thin" x1="246" y1="372" x2="246" y2="500"/>
  <line class="dim" x1="24" y1="490" x2="246" y2="490" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="135" y="518" text-anchor="middle" class="lbl">AGENT READS: ADDRESSES</text>
  <line class="thin" x1="1004" y1="372" x2="1004" y2="500"/><line class="thin" x1="1184" y1="372" x2="1184" y2="500"/>
  <line class="dim" x1="1004" y1="490" x2="1184" y2="490" marker-start="url(#tk)" marker-end="url(#tk)"/>
  <text x="1094" y="518" text-anchor="middle" class="lbl">AGENT READS: [redacted]</text>
  <text x="590" y="506" text-anchor="middle" class="c ink">$ mcpv run -- npm run dev</text>
  <text x="590" y="526" text-anchor="middle" class="lbl">ONE COMMAND · ONE PROCESS</text>

  <!-- the travelling secret (hidden under reduced motion) -->
  <g class="anim">
    <circle r="6" stroke="#ffffff" stroke-width="2" fill="#5a46f0" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.8;1"><mpath href="#route"/></animateMotion>
      <animate attributeName="fill" dur="6s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.673;1" values="#5a46f0;#b42318;#b42318"/>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.02;0.8;0.83;1" values="0;1;1;0;0"/>
      <animate attributeName="r" dur="6s" repeatCount="indefinite" keyTimes="0;0.16;0.2;0.24;1" values="6;6;9;6;6"/>
    </circle>
  </g>
</g>

<!-- legend -->
<path d="M0.5 620H1239.5V771.5a18 18 0 0 1-18 18H18.5a18 18 0 0 1-18-18z" fill="#f3f3f6"/>
<line x1="0.5" y1="620" x2="1239.5" y2="620" class="rule"/>
<g class="co"><circle cx="38" cy="660" r="13"/><text x="38" y="664.5" text-anchor="middle">1</text></g>
<text x="62" y="665" class="hl">.env</text>
<text x="62" y="690" class="p">Holds mcpm:// addresses,</text>
<text x="62" y="712" class="p">not values. Paste it,</text>
<text x="62" y="734" class="p">commit it, let an agent</text>
<text x="62" y="756" class="p">read it.</text>
<g class="co"><circle cx="278" cy="660" r="13"/><text x="278" y="664.5" text-anchor="middle">2</text></g>
<text x="302" y="665" class="hl">Vault</text>
<text x="302" y="690" class="p">AES-256-GCM, fresh IV,</text>
<text x="302" y="712" class="p">address bound as AAD.</text>
<text x="302" y="734" class="p">Master key in the OS</text>
<text x="302" y="756" class="p">keychain.</text>
<g class="co"><circle cx="518" cy="660" r="13"/><text x="518" y="664.5" text-anchor="middle">3</text></g>
<text x="542" y="665" class="hl">Child process</text>
<text x="542" y="690" class="p">Gets the real values in</text>
<text x="542" y="712" class="p">its environment. Never</text>
<text x="542" y="734" class="p">gets the master key.</text>
<g class="co"><circle cx="758" cy="660" r="13"/><text x="758" y="664.5" text-anchor="middle">4</text></g>
<text x="782" y="665" class="hl">Mask</text>
<text x="782" y="690" class="p">Every secret in stdout</text>
<text x="782" y="712" class="p">and stderr becomes</text>
<text x="782" y="734" class="p"><tspan style="fill:#b42318;font-weight:600">[redacted]</tspan>, even across</text>
<text x="782" y="756" class="p">split writes.</text>
<g class="co"><circle cx="998" cy="660" r="13"/><text x="998" y="664.5" text-anchor="middle">5</text></g>
<text x="1022" y="665" class="hl">Agent</text>
<text x="1022" y="690" class="p">Sees the command, key</text>
<text x="1022" y="712" class="p">names and masked</text>
<text x="1022" y="734" class="p">output. Never a value.</text>
</svg>
